name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests PostgreSQL et package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Autoriser Maven Wrapper
        run: chmod +x mvnw

      - name: Vérifier l’hygiène du dépôt
        run: ./scripts/check-repository-hygiene.sh

      - name: Vérifier l’architecture backend
        run: ./scripts/check-backend-architecture.sh

      - name: Vérifier les contrats VPerf
        run: ./scripts/check-VPerf.sh

      - name: Vérifier le backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Déploiement Render
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Déclencher Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Ignorer le déploiement sans secret
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "Déploiement ignoré : secret Render non configuré."
