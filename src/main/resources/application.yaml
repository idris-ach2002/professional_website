server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript,image/svg+xml
  tomcat:
    max-swallow-size: ${MAX_SWALLOW_SIZE:12MB}
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  application:
    name: professional_website

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Aiven Free limite le service à 20 connexions et ne fournit pas de
      # PgBouncer managé. Un petit pool applicatif évite de saturer la base.
      pool-name: PortfolioHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:120000}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        default_batch_fetch_size: ${HIBERNATE_BATCH_FETCH_SIZE:32}
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:32}
        order_inserts: true
        order_updates: true
        generate_statistics: ${HIBERNATE_GENERATE_STATISTICS:false}

  cache:
    type: caffeine
    cache-names: publicWebsite,publicWebsiteList,publicProject,publicSeoSnapshot
    caffeine:
      spec: maximumSize=256,expireAfterWrite=120s,recordStats

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

portfolio:
  security:
    admin:
      username: ${PORTFOLIO_ADMIN_USERNAME}
      password: ${PORTFOLIO_ADMIN_PASSWORD}

storage:
  provider: ${STORAGE_PROVIDER:local}
  location: ${UPLOAD_DIR:/tmp/uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:portfolio}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

app:
  cors:
    # Liste d'origines autorisées pour les appels API avec credentials.
    # Local dev Vite: http://localhost:5173
    # Local preview Vite: http://localhost:4173
    # Production Cloudflare: https://professional-website-front.achabou02idris.workers.dev
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173,https://professional-website-front.achabou02idris.workers.dev,https://idris-achabou.fit}}

  analytics:
    # Secret utilisé pour hasher les IDs visiteurs/sessions avant stockage.
    hash-secret: ${APP_ANALYTICS_HASH_SECRET:${PORTFOLIO_ADMIN_PASSWORD:local-analytics-secret}}
    max-events-per-minute: ${APP_ANALYTICS_MAX_EVENTS_PER_MINUTE:120}

  upload:
    max-bytes: ${APP_UPLOAD_MAX_BYTES:10485760}

  concurrency:
    cpu-core-size: ${APP_CPU_CORE_SIZE:0}
    cpu-max-size: ${APP_CPU_MAX_SIZE:0}
    cpu-queue-capacity: ${APP_CPU_QUEUE_CAPACITY:128}
    io-core-size: ${APP_IO_CORE_SIZE:0}
    io-max-size: ${APP_IO_MAX_SIZE:0}
    io-queue-capacity: ${APP_IO_QUEUE_CAPACITY:128}
    virtual-io-max-concurrency: ${APP_VIRTUAL_IO_MAX_CONCURRENCY:0}
    maintenance-core-size: ${APP_MAINTENANCE_CORE_SIZE:1}
    maintenance-max-size: ${APP_MAINTENANCE_MAX_SIZE:2}
    maintenance-queue-capacity: ${APP_MAINTENANCE_QUEUE_CAPACITY:64}
    analytics-queue-capacity: ${APP_ANALYTICS_QUEUE_CAPACITY:512}
    analytics-batch-size: ${APP_ANALYTICS_BATCH_SIZE:32}
    analytics-flush-interval-ms: ${APP_ANALYTICS_FLUSH_INTERVAL_MS:750}
  frontend:
    # Origine utilisée comme fallback quand aucune URL redirect valide n'est fournie.
    origin: ${APP_FRONTEND_ORIGIN:https://idris-achabou.fit}
    # Origines acceptées pour les redirections post-login.
    allowed-origins: ${APP_FRONTEND_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173,https://professional-website-front.achabou02idris.workers.dev,https://idris-achabou.fit}}}

translation:
  libretranslate:
    enabled: ${LIBRETRANSLATE_ENABLED:true}
    base-url: ${LIBRETRANSLATE_BASE_URL:http://localhost:5000}
    timeout: ${LIBRETRANSLATE_TIMEOUT:45s}


springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: sorbonne.professional_website
