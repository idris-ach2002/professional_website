server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: ${MAX_SWALLOW_SIZE:12MB}
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  application:
    name: professional_website

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Aiven Free limite le service à 20 connexions et ne fournit pas de
      # PgBouncer managé. Un petit pool applicatif évite de saturer la base.
      pool-name: PortfolioHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:120000}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

portfolio:
  security:
    admin:
      username: ${PORTFOLIO_ADMIN_USERNAME}
      password: ${PORTFOLIO_ADMIN_PASSWORD}

storage:
  provider: ${STORAGE_PROVIDER:local}
  location: ${UPLOAD_DIR:/tmp/uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:portfolio}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    # Liste d'origines autorisées pour les appels API avec credentials.
    # Local dev Vite: http://localhost:5173
    # Local preview Vite: http://localhost:4173
    # Production Cloudflare: https://professional-website-front.achabou02idris.workers.dev
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173,https://professional-website-front.achabou02idris.workers.dev,https://idris-achabou.fit}}

  analytics:
    # Secret utilisé pour hasher les IDs visiteurs/sessions avant stockage.
    hash-secret: ${APP_ANALYTICS_HASH_SECRET:${PORTFOLIO_ADMIN_PASSWORD:local-analytics-secret}}
  frontend:
    # Origine utilisée comme fallback quand aucune URL redirect valide n'est fournie.
    origin: ${APP_FRONTEND_ORIGIN:https://idris-achabou.fit}
    # Origines acceptées pour les redirections post-login.
    allowed-origins: ${APP_FRONTEND_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173,https://professional-website-front.achabou02idris.workers.dev,https://idris-achabou.fit}}}
cv:
  generation:
    compiler: ${CV_LATEX_COMPILER:latexmk}
    timeout-seconds: ${CV_LATEX_TIMEOUT_SECONDS:45}
    store-latex-source: ${CV_STORE_LATEX_SOURCE:true}

translation:
  libretranslate:
    enabled: ${LIBRETRANSLATE_ENABLED:true}
    base-url: ${LIBRETRANSLATE_BASE_URL:http://localhost:5000}
    timeout: ${LIBRETRANSLATE_TIMEOUT:45s}
